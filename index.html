<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sega Genesis / Mega Drive — Web Emulator</title>
    <style>
        :root {
            --bg: #0b0f1a;
            --panel: #131a2b;
            --panel-hover: #1c2640;
            --border: #27324d;
            --text: #e6ecff;
            --muted: #8a94b0;
            --accent: #ffcc00;
            --blue: #0066ff;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            min-height: 100vh;
        }
        header {
            text-align: center;
            padding: 20px 16px;
            background: linear-gradient(180deg, #0033a0 0%, #001766 100%);
            border-bottom: 2px solid var(--accent);
        }
        header h1 { margin: 0; font-size: 24px; letter-spacing: 1px; }
        header p { margin: 4px 0 0; font-size: 13px; opacity: 0.85; }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }

        /* ---- Selector ---- */
        .toolbar {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        #search {
            flex: 1;
            min-width: 240px;
            padding: 10px 14px;
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        #search:focus { border-color: var(--accent); }
        #count { font-size: 13px; color: var(--muted); }

        #games {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 8px;
        }
        .game {
            text-align: left;
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 14px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, transform 0.05s;
            font-family: inherit;
        }
        .game:hover { background: var(--panel-hover); border-color: var(--accent); }
        .game:active { transform: scale(0.98); }

        .status {
            text-align: center;
            padding: 40px;
            color: var(--muted);
        }
        .error {
            background: #3a1a1a;
            border: 1px solid #a33;
            padding: 16px;
            border-radius: 6px;
            color: #ffbaba;
        }

        /* ---- Player ---- */
        #player-wrap { display: none; }
        #player-wrap.active { display: block; }
        .player-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        #back {
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 14px;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
        }
        #back:hover { background: var(--panel-hover); border-color: var(--accent); }
        #now-playing { font-size: 15px; color: var(--muted); }
        #now-playing b { color: var(--text); }

        #game {
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #000;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.2);
            border-radius: 4px;
            overflow: hidden;
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: var(--muted);
        }
        footer a { color: var(--accent); text-decoration: none; }
        footer a:hover { text-decoration: underline; }
        kbd {
            background: #222;
            border: 1px solid #444;
            border-radius: 3px;
            padding: 1px 5px;
            font-family: monospace;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Sega Genesis / Mega Drive</h1>
        <p>Pick a game — plays in your browser</p>
    </header>

    <main>
        <section id="selector">
            <div class="toolbar">
                <input type="search" id="search" placeholder="Search games…" autocomplete="off">
                <span id="count"></span>
            </div>
            <div id="games"></div>
            <div id="status" class="status">Loading game list from archive.org…</div>
        </section>

        <section id="player-wrap">
            <div class="player-bar">
                <button id="back">← Back to list</button>
                <span id="now-playing"></span>
            </div>
            <div id="game"></div>
            <p style="margin-top:14px; font-size:13px; color: var(--muted);">
                Default keys: Arrows = D-Pad &middot;
                <kbd>X</kbd> A &middot; <kbd>S</kbd> B &middot; <kbd>Z</kbd> C &middot;
                <kbd>Enter</kbd> Start
            </p>
        </section>
    </main>

    <footer>
        ROMs streamed from
        <a href="https://archive.org/details/sega-genesis-megadrive-rom-collection-usa" target="_blank" rel="noopener">archive.org</a>.
        Emulation by
        <a href="https://emulatorjs.org" target="_blank" rel="noopener">EmulatorJS</a>.
    </footer>

    <script>
        const IA_ID = 'sega-genesis-megadrive-rom-collection-usa';
        const ROM_EXT = /\.(zip|md|bin|gen|smd|32x)$/i;

        const $games   = document.getElementById('games');
        const $status  = document.getElementById('status');
        const $search  = document.getElementById('search');
        const $count   = document.getElementById('count');
        const $sel     = document.getElementById('selector');
        const $player  = document.getElementById('player-wrap');
        const $back    = document.getElementById('back');
        const $np      = document.getElementById('now-playing');

        let allRoms = [];

        function prettyName(filename) {
            return filename
                .replace(/\.[^.]+$/, '')
                .replace(/\s*\(USA(?:,\s*Europe)?\)/gi, '')
                .replace(/\s*\[!\]/g, '')
                .trim();
        }

        function render(list) {
            $games.innerHTML = '';
            const frag = document.createDocumentFragment();
            list.forEach(rom => {
                const btn = document.createElement('button');
                btn.className = 'game';
                btn.textContent = prettyName(rom.name);
                btn.title = rom.name;
                btn.addEventListener('click', () => play(rom));
                frag.appendChild(btn);
            });
            $games.appendChild(frag);
            $count.textContent = `${list.length} game${list.length === 1 ? '' : 's'}`;
        }

        async function loadList() {
            try {
                const res = await fetch(`https://archive.org/metadata/${IA_ID}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                const files = (data.files || []).filter(f => ROM_EXT.test(f.name));
                files.sort((a, b) => a.name.localeCompare(b.name));
                allRoms = files;
                $status.style.display = 'none';
                render(allRoms);
            } catch (err) {
                $status.className = 'status error';
                $status.textContent = `Failed to load game list: ${err.message}`;
            }
        }

        $search.addEventListener('input', () => {
            const q = $search.value.trim().toLowerCase();
            if (!q) { render(allRoms); return; }
            const filtered = allRoms.filter(r => r.name.toLowerCase().includes(q));
            render(filtered);
        });

        function formatSize(bytes) {
            if (!bytes) return '?';
            const mb = bytes / 1024 / 1024;
            return mb >= 1 ? `${mb.toFixed(1)} MB` : `${Math.round(bytes / 1024)} KB`;
        }

        async function downloadWithProgress(url, onProgress) {
            const res = await fetch(url, { mode: 'cors', credentials: 'omit' });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const total = Number(res.headers.get('Content-Length')) || 0;
            if (!res.body || !res.body.getReader) {
                const blob = await res.blob();
                onProgress(blob.size, blob.size);
                return blob;
            }
            const reader = res.body.getReader();
            const chunks = [];
            let loaded = 0;
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                chunks.push(value);
                loaded += value.byteLength;
                onProgress(loaded, total);
            }
            return new Blob(chunks);
        }

        function bootEmulator(blobUrl, name) {
            window.EJS_player = '#game';
            window.EJS_core = 'segaMD';
            window.EJS_gameUrl = blobUrl;
            window.EJS_gameName = name;
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
            window.EJS_startOnLoaded = false;

            const script = document.createElement('script');
            script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            document.body.appendChild(script);
        }

        async function play(rom) {
            $sel.style.display = 'none';
            $player.classList.add('active');
            const name = prettyName(rom.name);
            const setMsg = (html) => { $np.innerHTML = html; };
            setMsg(`Preparing <b>${name}</b>…`);

            const direct = `https://archive.org/download/${IA_ID}/${encodeURIComponent(rom.name)}`;
            const proxied = `https://corsproxy.io/?url=${encodeURIComponent(direct)}`;

            const onProgress = (loaded, total) => {
                const pct = total ? ` (${Math.round((loaded / total) * 100)}%)` : '';
                setMsg(`Downloading <b>${name}</b>… ${formatSize(loaded)} / ${formatSize(total)}${pct}`);
            };

            let blob;
            try {
                blob = await downloadWithProgress(direct, onProgress);
            } catch (err) {
                setMsg(`Direct download failed (${err.message}); retrying via proxy…`);
                try {
                    blob = await downloadWithProgress(proxied, onProgress);
                } catch (err2) {
                    setMsg(`<span style="color:#ffbaba">Failed to load <b>${name}</b>: ${err2.message}</span>`);
                    return;
                }
            }

            const blobUrl = URL.createObjectURL(blob);
            setMsg(`Now playing: <b>${name}</b>`);
            bootEmulator(blobUrl, name);
        }

        $back.addEventListener('click', () => {
            // Simplest reliable way to tear down EmulatorJS state.
            location.reload();
        });

        loadList();
    </script>
</body>
</html>
